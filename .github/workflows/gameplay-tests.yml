name: NASIB +62 gameplay and responsive tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasib62-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Audit direct and transitive npm dependencies
        run: npm audit --audit-level=high
      - name: Install browser test runner without changing project dependencies
        run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate AI and engine patch
        run: npm run check
      - name: Build production app
        run: npm run build
      - name: Run real-browser gameplay and mobile tests
        run: npm run test:e2e
