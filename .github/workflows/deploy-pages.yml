name: Deploy NASIB +62 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate the game engine patch
        run: npm run check
      - name: Build production site
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Prepare Pages output
        run: node scripts/prepare-pages.mjs
      - name: Publish compiled bundle to the branch-root Pages source
        run: |
          set -e
          rm -f assets/index-*.js assets/index-*.css assets/app-*.js assets/app-*.css assets/realtime-*.js assets/IntroOverlay-*.js
          cp dist/index.html index.html
          mkdir -p assets
          cp dist/assets/* assets/
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html .nojekyll assets/
          if git diff --cached --quiet; then
            echo "The published bundle is already up to date."
          else
            git commit -m "build: publish compiled NASIB +62 site"
            git push origin HEAD:main
          fi
